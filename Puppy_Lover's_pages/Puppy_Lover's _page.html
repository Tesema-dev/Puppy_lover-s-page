<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Puppy Lover's Page</title>
    <link rel="stylesheet" href="puppy_page.css" />
  </head>
  <body>
    <!-- This is the header section -->
    <header class="header">
      <h1>Puppy Lover's page</h1>

    <section class="banner">
      <div>
        <img src="../images/banner-puppies.jpg" alt="Banner-image" />

    <!-- three puppy page  section -->
    <section class="three-puppies">
      <div class="puppy-1 gap puppies">
        <img src="../images/puppy-1.jpg" alt="" />
      </div>
      <div class="missing gap red-box puppies display">
        <p>missing Puppy here!!!</p>
      </div>

      <div class="puppy-2 gap puppies">
        <img src="../images/puppy-2.jpg" alt="puppy-two" />
      </div>
    </section>
    <!-- this is for the text one -->
    <section>
      <div class="alone">
        <h3>More Puppies</h3>
      </div>
    </section>
    <!-- for two puppy section -->
    <section class="two-puppy">
      <div class="puppy-3 gap puppies">
        <img src="../images/puppy-3.jpg" alt="puppy-3" />
      </div>
      <div class="puppy-4 gap puppies">
        <img src="../images/puppy-4.jpg" alt="puppy-4" />
      </div>
    </section>
    <!-- This is for te footer section -->
    <footer class="footer">
      <p>Diveloped by: Tesema.</p>
    </footer>
